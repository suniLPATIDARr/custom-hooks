<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Closure Demo</title>
  </head>
  <body>
    <h2>Open the console to see closure in action</h2>
    <button id="clickBtn">Click Me</button>

    <script>
      function createCounter() {
        let count = 0;

        return function () {
          count++;
          console.log("Clicked", count, "times");
        };
      }

      const counter = createCounter();

      document.getElementById("clickBtn").addEventListener("click", counter);
    </script>
  </body>
</html>
